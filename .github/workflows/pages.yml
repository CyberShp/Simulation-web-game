name: Publish Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
      - name: Build versioned Pages tree
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: npm run build:web -- --tag="$SOURCE_COMMIT"
      - name: Update existing Pages branch
        run: node scripts/release/publish-pages.mjs
      - name: Build and verify GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/request-pages-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: published-pages-tree
          path: dist/web/
          include-hidden-files: true
          if-no-files-found: error
