# Include inside nginx's http context. Serve dist/ through the current release symlink.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/simulation-web-game/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* \.(png|webp)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
