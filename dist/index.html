<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173e37"><meta name="description" content="在云岫山间经营自己的仙府：营造庭院、培育弟子、种植灵草，静观一方天地生长。"><title>模拟仙府 · 青岚初境</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23173e37'/%3E%3Cpath d='M10 45 26 17 37 37 45 25 56 45Z' fill='none' stroke='%23d8b878' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"></head><body>
<div id="game">
<header class="topbar"><div class="brand"><div class="seal">仙</div><div><h1>模拟仙府</h1><span>青岚初境 · 山居篇</span></div></div><div id="resources" class="resources" aria-live="off"></div><button class="icon-button" id="help" title="游玩指引" aria-label="游玩指引">?</button><button class="icon-button" id="settings" title="存档与设置" aria-label="存档与设置">⚙</button></header>
<main id="viewport" aria-label="仙府经营地图"><canvas id="world" aria-label="俯视仙府地图，可拖动平移；选择建筑后点击空地建造"></canvas><div id="asset-status" class="asset-status">正在铺开山河画卷…</div>
<div class="location"><span class="eyebrow">云岫山 · 福地一阶</span><h2>青岚仙府<span class="small-seal">初</span></h2><div class="weather"><span class="sun">☼</span><span id="game-date">第 1 日 · 辰时</span><span class="divider"></span><span>晴 · 灵气充盈</span></div></div>
<div class="map-tools"><button id="zoom-in" aria-label="放大地图" title="放大地图">＋</button><button id="zoom-out" aria-label="缩小地图" title="缩小地图">−</button><button id="recenter" aria-label="回到仙府中心" title="回到仙府中心">⌖</button><button id="grid-toggle" aria-label="切换地块网格" title="切换地块网格">▦</button></div>
<aside class="right-stack"><section class="quest-panel paper"><div class="section-head"><span>仙府纪事</span><span class="muted" id="quest-count">壹 / 叁</span></div><div id="quest"></div></section><section id="detail" class="detail-panel paper"></section></aside>
<div id="placement-bar" class="placement-bar hidden"><span id="placement-text"></span><button id="cancel-build">取消 <kbd>Esc</kbd></button></div>
<div id="toast" role="status" aria-live="polite" class="toast hidden"></div>
<div class="time-controls paper"><span class="time-mark">☼</span><button id="pause" aria-label="暂停游戏" title="暂停或继续（空格）">Ⅱ</button><button data-speed="1" class="active">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div>
<div class="map-caption">拖动画卷平移 · 滚轮缩放</div>
<section class="bottom-panel paper"><nav class="bottom-nav" aria-label="仙府管理"><div class="nav-tabs"><button data-tab="build" class="active"><span>⌂</span> 营造</button><button data-tab="disciples"><span>♧</span> 弟子 <b id="disciple-count">3</b></button><button data-tab="journal"><span>▤</span> 府中见闻</button></div><div class="bottom-summary" id="bottom-summary"></div></nav><div id="bottom-content"></div></section>
</main><footer><span>模拟仙府 <span class="version">v0.1.1 · 初境</span></span><span>本次游玩进度请通过设置导出存档</span><span id="status-time">天地自有时序</span></footer></div>
<dialog id="modal" class="modal paper"><div class="modal-top"><h2 id="modal-title"></h2><button id="close-modal" class="icon-button" aria-label="关闭弹窗">×</button></div><div id="modal-body"></div></dialog><input type="file" id="import-file" accept=".json,application/json" hidden>
<script type="module" src="./game.mjs"></script></body></html>
