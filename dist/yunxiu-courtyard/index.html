<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#203c35"><title>云岫别院 · 山院场景</title><link rel="stylesheet" href="style.css?v=courtyard-1.2"></head>
<body><main id="scene" aria-label="云岫别院可交互场景"><canvas id="world" aria-label="山院道路：点击地面移动掌门，点击建筑查看详情" tabindex="0"></canvas>
<header class="location parchment"><svg viewBox="0 0 68 52" aria-hidden="true"><path d="M0 48 18 8 29 25 40 0 62 48Z" fill="#789386" opacity=".55"/><path d="m11 44 17-29 11 24 12-18 17 27" fill="#456457" opacity=".65"/></svg><div><h1>云岫别院</h1><p id="calendar">第十二日 · 晴岚</p></div><span class="sun">☀</span></header>
<div id="resources" aria-label="山院资源"></div><div class="utilities"><button id="settings" title="设置" aria-label="设置"></button><button id="journal" title="纪事" aria-label="打开纪事"></button></div>
<nav id="systems" aria-label="各个系统"></nav>
<button class="quest parchment" id="quest"><span id="quest-icon"></span><span><b>旧卷余温</b><small id="quest-text">整理母亲的药理札记</small></span><span class="chevron">›</span></button>
<section id="selection" class="parchment" aria-label="场景对象详情"></section>
<div class="timebar"><button id="pause" aria-label="暂停">Ⅱ</button><button data-speed="1" class="active">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button></div>
<div class="status"><span id="save-status">已保存</span><button id="guide" aria-label="操作帮助">?</button></div>
<div id="notice" role="status" aria-live="polite"></div><div id="loading">竹影渐开，山院初醒……</div>
<aside id="panel" class="parchment" hidden aria-label="系统面板"><div class="panel-head"><h2 id="panel-title"></h2><button id="close-panel" aria-label="关闭面板">×</button></div><div id="panel-body"></div></aside>
<div id="walk-status" class="sr-only" role="status"></div>
</main><script type="module" src="app.mjs?v=courtyard-1.2"></script></body></html>
