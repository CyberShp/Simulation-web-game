    return `<h3 class="pane-title">人情纪事</h3><div class="profile-relation"><span class="icon-slot">${icon('person')}</span><div><strong>与掌门 · ${person.relation}</strong><p>${person.story}</p></div></div><div class="profile-relation"><span class="icon-slot">${icon('flag')}</span><div><strong>${person.peak} · ${person.rank}</strong><p>在峰中修行，并依自身意愿承担事务。</p></div></div><h4>当前约定</h4><p>${person.promise}</p>${requests[person.id] ? `<p class="gold">另有邀约待回应：${requests[person.id].job}</p>` : ''}`;

  function renderPersonDetail() {
    const person = getPerson();
    return `<div class="people-detail"><div class="people-detail-nav">${button('people-back', '‹ 返回名册')}<span class="subtle">${roster.peak === '全部' ? '全宗门' : roster.peak} / ${person.name}</span><div class="toolbar">${button('person-previous', '上一位')}${button('person-next', '下一位')}</div></div><div class="people-detail-layout"><aside class="pane profile-person"><div class="profile-person-portrait">${g().portrait(person.portrait, true)}</div><h2>${person.name}</h2><p class="gold">${person.realm} · ${person.rank}</p><p>${person.peak}</p><div class="people-current"><span class="subtle">当前事务</span><strong>${person.work}</strong><span>${person.place}</span></div>${button('person-locate', '在山院中定位')}</aside><section class="pane people-detail-content"><nav class="panel-tabs">${[['cultivation', '修行'], ['equipment', '装备'], ['health', '身况'], ['relations', '关系']].map(([id, title]) => `<button data-action="person-tab" data-tab="${id}" class="${roster.tab === id ? 'active' : ''}">${title}</button>`).join('')}</nav><div class="people-detail-body">${personDetailBody(person)}</div></section>${personSummary(person)}</div></div>`;
  }

  function equipmentBody(compact = false) {
    return `<div class="profile-equipment-body${compact ? ' compact' : ''}"><div class="profile-body-portrait">${g().portrait(0, true)}</div>${slots.map(slot => { const item = getItem(master.equipment[slot.id]); return `<button class="profile-equip-slot profile-slot-${slot.id}" data-action="equipment-slot" data-slot="${slot.id}" data-id="${item.id}" aria-label="${slot.label}：${item.name}，查看装备"><span class="subtle">${slot.label}</span><span class="icon-slot profile-item-tier-${item.tier}">${icon(item.kind)}</span><strong>${item.name}</strong></button>`; }).join('')}</div>`;
  }

  function masterStats() {
    const equipped = Object.values(master.equipment).map(getItem);
    return { attack: 26 + equipped.reduce((sum, item) => sum + item.attack, 0), defense: 12 + equipped.reduce((sum, item) => sum + item.defense, 0) };
  }

  function renderMaster() {
    const stats = masterStats();
    return `<div class="profile-layout"><aside class="pane profile-vitals"><h3 class="pane-title">身况</h3>${g().bar('气血', master.health, 100, master.health < 60 ? 'red' : 'jade')}${g().bar('精力', master.energy, 100)}${g().bar('灵力', master.mana, 120)}<div class="profile-condition"><strong>${master.health < 100 ? '肩背余伤' : '气血充盈'}</strong><p>${master.health < 100 ? '伤势已稳定，调息与丹药有助于恢复。' : '旧伤渐愈，运气已无滞涩。'}</p></div><div class="profile-stat-grid"><div class="stat-pair"><span>攻伐</span><strong>${stats.attack}</strong></div><div class="stat-pair"><span>护体</span><strong>${stats.defense}</strong></div><div class="stat-pair"><span>神识</span><strong>42</strong></div><div class="stat-pair"><span>根骨</span><strong>上佳</strong></div></div><div class="toolbar">${button('master-breathe', master.activity === '调息中' ? '收功' : '调息', '', true)}${button('master-medicine', '查看丹药')}</div><p class="subtle profile-activity">${master.activity} · ${master.place}</p></aside>
      <section class="pane profile-person"><div class="profile-heading"><h2>${master.name}</h2><span>云岫掌门 · 炼气六层</span></div>${equipmentBody()}<div class="profile-equipment-footer"><span class="subtle">随身装备</span>${button('master-bag', '打开行囊')}</div></section>
      <section class="pane profile-cultivation"><h3 class="pane-title">修行</h3>${g().bar('修为', master.cultivation, 1000)}<div class="profile-realm"><strong>炼气六层</strong><span class="subtle">下一层 · 修为尚差 ${1000 - master.cultivation}</span></div><div class="profile-config">${[['心法', '清溪养元诀', 'book', '吐纳养气 · 炼气篇'], ['攻伐', '青岚剑诀', 'sword', '近身剑招 · 已习得'], ['守御', '定岳护身篇', 'jade', '护持心神 · 已习得']].map(([label, name, kind, detail]) => `<button class="profile-art-slot" data-action="master-art" data-art="${name}"><span class="icon-slot">${icon(kind)}</span><span><small>${label}</small><strong>${name}</strong><span class="subtle">${detail}</span></span><b>›</b></button>`).join('')}</div><div class="profile-practice"><p>${master.activity === '修炼中' ? '已在静室静心吐纳。' : '静室可用，灵气平稳。'}</p>${button('master-practice', master.activity === '修炼中' ? '结束修炼' : '开始修炼', '', true)}</div></section></div>`;
  }

  function filteredItems() {
    const q = bag.query.trim();
    const result = items.filter(item => item.count > 0 && (bag.category === '全部' || item.category === bag.category) && (!q || item.name.includes(q)));
    if (bag.sorted) result.sort((a, b) => b.tier - a.tier || a.category.localeCompare(b.category, 'zh'));
    return result;
  }

  function renderBagDetail() {
    const item = getItem(bag.selected);
    if (!item) return '<div class="empty-state">选择一件随身物品<br>查看属性与用途</div>';
    const equipped = item.slot && master.equipment[item.slot] === item.id;
    return `<div class="bag-item-heading"><span class="icon-slot bag-featured-icon profile-item-tier-${item.tier}">${icon(item.kind)}</span><span><h3>${item.name}</h3><span class="gold">${item.quality} · ${item.category}</span></span></div><p class="bag-description">${item.info}</p><div class="bag-item-effect">${item.detail}</div><dl class="people-facts"><div><dt>数量</dt><dd>行囊 ${item.count}${equipped ? ' · 已装备 1' : ''}</dd></div><div><dt>用途</dt><dd>${item.use}</dd></div><div><dt>来源</dt><dd>${item.source}</dd></div>${item.slot ? `<div><dt>当前部位</dt><dd>${slots.find(slot => slot.id === item.slot).label} · ${getItem(master.equipment[item.slot]).name}</dd></div>` : ''}</dl>
      ${item.slot && !equipped ? `<div class="bag-compare"><h4>更换后</h4><span>攻伐 <b class="${item.attack - getItem(master.equipment[item.slot]).attack < 0 ? 'danger' : 'good'}">${signed(item.attack - getItem(master.equipment[item.slot]).attack)}</b></span><span>护体 <b class="${item.defense - getItem(master.equipment[item.slot]).defense < 0 ? 'danger' : 'good'}">${signed(item.defense - getItem(master.equipment[item.slot]).defense)}</b></span></div>` : ''}
      <div class="bag-item-actions">${item.slot ? button('bag-equip', equipped ? '已装备' : '装备', equipped || item.count === 0 ? 'disabled' : '', true) : item.effect ? button('bag-consume', '服用一份', item.count === 0 || master[item.effect] >= (item.effect === 'mana' ? 120 : 100) ? 'disabled' : '', true) : item.id === 'scroll' ? button('bag-read', '查阅手札', '', true) : '<p class="subtle">存入公库后可用于宗门工单。</p>'}${button('bag-store', '移入公库 ×1', item.count === 0 ? 'disabled' : '')}</div>${bag.notice ? `<p class="bag-notice good" role="status">${esc(bag.notice)}</p>` : ''}`;
  }

  const signed = number => number > 0 ? `+${number}` : String(number);

  function renderBag() {
    const visible = filteredItems();
    const carried = items.filter(item => item.count > 0).length;
    const deposited = Object.values(bag.store).reduce((sum, count) => sum + count, 0);
    return `<div class="bag-layout"><section class="pane bag-equipment"><div class="pane-title"><h3>${master.name}</h3><span class="subtle">随身装备</span></div>${equipmentBody(true)}${g().bar('气血', master.health, 100)}${g().bar('精力', master.energy, 100)}<div class="toolbar">${button('bag-master', '人物详情')}</div></section><section class="pane bag-inventory"><div class="pane-title"><h3>随身行囊</h3><span class="subtle">${carried} / 24 格</span></div><div class="tab-row bag-categories">${['全部', '装备', '丹药', '材料', '典籍'].map(category => `<button class="${bag.category === category ? 'active' : ''}" data-action="bag-category" data-category="${category}">${category}</button>`).join('')}</div><div class="toolbar"><input data-field="bag-search" aria-label="搜索行囊" placeholder="查找物品" value="${esc(bag.query)}">${button('bag-sort', bag.sorted ? '已按品相整理' : '整理')}</div><div class="bag-grid">${visible.map(item => `<button class="bag-slot profile-item-tier-${item.tier}${bag.selected === item.id ? ' selected' : ''}" data-action="bag-select" data-id="${item.id}" aria-label="${item.name}，${item.count}份"><span class="bag-slot-icon">${icon(item.kind)}</span><span class="bag-slot-name">${item.name}</span><b>${item.count}</b></button>`).join('')}${Array.from({ length: Math.max(0, 18 - visible.length) }, () => '<div class="bag-slot empty" aria-hidden="true"></div>').join('')}</div>${!visible.length ? '<p class="empty-state">此分类下暂无物品。</p>' : ''}<div class="bag-inventory-footer"><span>公库已收：${deposited} 份</span><span class="subtle">${bag.sorted ? '按品相排列' : '按收纳顺序排列'}</span></div></section><aside class="pane bag-detail">${renderBagDetail()}</aside></div>`;
  }

  function openArt(name, personId) {
    const law = { '清溪养元诀': 'qingxi', '青岚剑诀': 'qinglan', '定岳护身篇': 'dingyue', '回春符解': 'huichun', '小五行阵录': 'wuxing' }[name];
    if (!law) { g().toast(`${name}尚未收入本门藏经。`); return; }
    g().open('arts', { law, person: ['lin', 'zhao', 'shen'].includes(personId) ? personId : undefined, from: g().current, returnPerson: personId });
  }

  function handleDisciples(buttonElement) {
    const d = buttonElement.dataset;
    const person = getPerson();
    if (d.action === 'people-peak') { roster.peak = d.peak; roster.page = 0; }
    else if (d.action === 'people-filter') { roster.filter = d.filter; roster.page = 0; }
    else if (d.action === 'people-select') roster.selected = d.id;
    else if (d.action === 'people-prev') roster.page = Math.max(0, roster.page - 1);
    else if (d.action === 'people-next') roster.page++;
    else if (d.action === 'person-detail') { roster.detail = true; roster.tab = 'cultivation'; }
    else if (d.action === 'people-back') roster.detail = false;
    else if (d.action === 'person-tab') roster.tab = d.tab;
    else if (d.action === 'person-next' || d.action === 'person-previous') { const list = filteredPeople(); const i = list.findIndex(p => p.id === person.id); roster.selected = list[(i + (d.action === 'person-next' ? 1 : -1) + list.length) % list.length]?.id || person.id; }
    else if (d.action === 'person-invite') { requests[person.id] = { job: roster.invitation }; g().toast(`已向${person.name}发出「${roster.invitation}」邀约，等待回应。`); }
    else if (d.action === 'invite-withdraw') { delete requests[person.id]; g().toast(`已撤回给${person.name}的事务邀约。`); }
    else if (d.action === 'person-locate') { g().open('scene', { person: person.id, label: `${person.name} · ${person.place}` }); return; }
    else if (d.action === 'person-art') { openArt(person.art, person.id); return; }
    else return;
    g().refresh();
  }

  function handlePeopleInput(element, eventType) {
    const field = element.dataset.field;
    if (field === 'invite-job') { roster.invitation = element.value; return; }
    if (field === 'people-search') roster.query = element.value;
    else if (field === 'people-rank') roster.rank = element.value;
    else if (field === 'people-sort') roster.sort = element.value;
    else return;
    roster.page = 0;
    g().refresh();
  }

  function handleMaster(buttonElement) {
    const d = buttonElement.dataset;
    if (d.action === 'equipment-slot') { g().open('bag', { selected: d.id, category: '装备' }); return; }
    if (d.action === 'master-bag') { g().open('bag'); return; }
    if (d.action === 'master-medicine') { g().open('bag', { selected: 'healing-pill', category: '丹药' }); return; }
    if (d.action === 'master-art') { openArt(d.art, 'shen'); return; }
    if (d.action === 'master-breathe') { master.activity = master.activity === '调息中' ? '静候' : '调息中'; g().toast(master.activity === '调息中' ? '沈照已在静室调息。' : '沈照已收功。'); }
    else if (d.action === 'master-practice') { master.activity = master.activity === '修炼中' ? '静候' : '修炼中'; g().toast(master.activity === '修炼中' ? '沈照开始研习清溪养元诀。' : '沈照结束本次修炼。'); }
    else return;
    g().refresh();
  }

  function handleBag(buttonElement) {
    const d = buttonElement.dataset;
    const item = getItem(bag.selected);
    if (d.action === 'bag-category') { bag.category = d.category; bag.notice = ''; }
    else if (d.action === 'bag-select' || d.action === 'equipment-slot') { bag.selected = d.id; bag.notice = ''; }
    else if (d.action === 'bag-sort') { bag.sorted = true; bag.notice = '已按品相整理行囊。'; }
    else if (d.action === 'bag-master') { g().open('master'); return; }
    else if (d.action === 'bag-read') { openArt('清溪养元诀', 'shen'); return; }
    else if (d.action === 'bag-equip' && item?.slot && item.count > 0 && master.equipment[item.slot] !== item.id) { const old = getItem(master.equipment[item.slot]); item.count--; old.count++; master.equipment[item.slot] = item.id; bag.notice = `已装备${item.name}，${old.name}放回行囊。`; g().toast(bag.notice); }
    else if (d.action === 'bag-consume' && item?.effect && item.count > 0) { const limit = item.effect === 'mana' ? 120 : 100; const restored = Math.min(item.amount, limit - master[item.effect]); if (restored <= 0) return; item.count--; master[item.effect] += restored; bag.notice = `服用${item.name}，${{ health: '气血', energy: '精力', mana: '灵力' }[item.effect]}恢复 ${restored}。剩余 ${item.count} 份。`; g().toast(bag.notice); }
    else if (d.action === 'bag-store' && item?.count > 0) { item.count--; bag.store[item.id] = (bag.store[item.id] || 0) + 1; g().addToStore?.(item.name, 1); bag.notice = `${item.name} ×1 已移入公库，行囊剩余 ${item.count} 份。`; g().toast(bag.notice); }
    else return;
    g().refresh();
  }

  panels.disciples = { title: '门人', render: () => roster.detail ? renderPersonDetail() : renderRoster(), click: handleDisciples, input: handlePeopleInput, enter(params = {}) { if (params.person && people.some(person => person.id === params.person)) roster.selected = params.person; if (params.detail) roster.detail = true; } };
  panels.master = { title: '掌门', render: renderMaster, click: handleMaster };
  panels.bag = { title: '行囊', render: renderBag, click: handleBag, input(element) { if (element.dataset.field === 'bag-search') { bag.query = element.value; g().refresh(); } }, enter(params = {}) { if (params.category) bag.category = params.category; if (params.selected && getItem(params.selected)) bag.selected = params.selected; bag.notice = ''; } };
}());

  function craftRequirements(current = recipe()) {

    if (worker.skills[current.group] < current.skill) reasons.push(`${worker.name}${group.label} ${worker.skills[current.group]}，需 ${current.skill}`);
    if (!station || station.group !== current.group) reasons.push('需选择适用工位');
    else if (station.unavailable) reasons.push(`${station.name}：${station.condition}`);

  }

        <div class="craft-stock-note"><span class="icon-slot">${icon('wood')}</span><p class="subtle">公库用料 · 按单留存</p></div>
      </aside>
      <section class="pane craft-recipe"><div class="craft-heading"><span class="icon-slot">${icon(current.icon)}</span><div><p class="subtle">${group.label} · ${current.quality}</p><h2>${current.name}</h2><span>${current.effect}</span></div></div>
        <p class="craft-lore">${current.description}</p>
        <div class="craft-flow"><div class="craft-materials">${current.materials.map(([id, count]) => `<div class="craft-material ${available(id) < count * craftState.quantity ? 'shortage' : ''}"><span class="icon-slot">${icon(stock[id].icon)}</span><span><strong>${stock[id].name}</strong><small>可用 ${available(id)}</small></span><span class="${available(id) < count * craftState.quantity ? 'danger' : 'good'}">× ${count * craftState.quantity}</span></div>`).join('')}</div><div class="craft-vessel"><img src="${current.group==='alchemy'?'alchemy-cauldron.png':current.group==='forge'?'spirit-forge.png':current.group==='puppet'?'jade-puppet.png':'spirit-medicine.png'}" alt="${group.label}工艺"><span>${station?.name?.split(' · ')[1]||group.label}</span></div><div class="craft-result"><span class="icon-slot">${icon(current.icon)}</span><strong>${current.name}</strong><span class="gold">${current.yield * craftState.quantity} ${current.outputUnit}</span></div></div>
        <div class="craft-process">${current.steps.map((step, index) => `<span><small>${['一', '二', '三'][index]}</small>${step}</span>`).join('<b aria-hidden="true">→</b>')}</div>
        <div class="craft-settings"><div class="craft-quantity"><span>数量</span><button class="game-button" data-action="craft-minus" aria-label="减少制作数量" ${craftState.quantity <= 1 ? 'disabled' : ''}>−</button><strong aria-live="polite">${craftState.quantity} ${current.unit}</strong><button class="game-button" data-action="craft-plus" aria-label="增加制作数量" ${craftState.quantity >= 9 ? 'disabled' : ''}>＋</button><span class="subtle">约 ${current.time * craftState.quantity} 时辰</span></div>
          <div class="craft-choose"><span>匠人</span><small class="subtle">需要${group.label} ${current.skill}</small><div class="craft-worker-choices">${people.map(item => `<button class="craft-worker-choice ${item.id === worker.id ? 'active' : ''}" data-action="craft-worker" data-id="${item.id}" aria-pressed="${item.id === worker.id}" aria-label="选择${item.name}，${group.label}${item.skills[current.group]}">${G().portrait(item.portrait)}<span><strong>${item.name}</strong><small class="${item.skills[current.group] < current.skill ? 'danger' : 'subtle'}">${group.label} ${item.skills[current.group]}</small></span></button>`).join('')}</div></div>
          <div class="craft-choose"><span>工位</span><div class="craft-station-choices">${stations.filter(item => item.group === current.group).map(item => `<button class="craft-station-choice ${item.id === craftState.station ? 'active' : ''}" data-action="craft-station" data-id="${item.id}" aria-pressed="${item.id === craftState.station}"><strong>${item.name}</strong><small class="${item.unavailable ? 'danger' : 'subtle'}">${item.condition}${craftState.orders.some(order => order.station === item.id) ? ` · 已有 ${craftState.orders.filter(order => order.station === item.id).length} 单` : ''}</small></button>`).join('')}</div></div>

  function artsClick(button) {
    const { action, id } = button.dataset;

    else if (action === 'arts-law') selectLaw(id);
    else if (action === 'arts-node') {
      if (law().nodes.some(item => item.id === id)) artsState.node = id;
    } else if (action === 'arts-type') artsState.type = id;
    else if (action === 'arts-learner') {

      const art = law(), item = node(), learner = person(artsState.learner);

    } else if (action === 'arts-cancel') {
      const index = artsState.study.findIndex(order => order.person === button.dataset.person);
      if (index < 0) return;
      const [order] = artsState.study.splice(index, 1);
      person(order.person).insight += order.cost;
      G().toast(person(order.person).rank === '掌门' ? '已撤销研习，参悟归还' : '已撤回邀约，参悟归还');
    } else return;
    G().refresh();
  }
  function craftsClick(button) {
    const { action, id } = button.dataset;
    if (action === 'craft-group') {
      const first = recipes.find(item => item.group === id);
      if (first) selectRecipe(first.id);
    } else if (action === 'craft-recipe') selectRecipe(id);
    else if (action === 'craft-worker') {
      if (people.some(item => item.id === id)) craftState.worker = id;
    } else if (action === 'craft-station') {
      if (stations.some(item => item.id === id && item.group === craftState.group)) craftState.station = id;
    }
    else if (action === 'craft-minus') craftState.quantity = Math.max(1, craftState.quantity - 1);
    else if (action === 'craft-plus') craftState.quantity = Math.min(9, craftState.quantity + 1);
    else if (action === 'craft-add') {
      const reasons = craftRequirements();
      if (reasons.length) { G().toast(reasons[0]); return; }
      craftState.orders.push({ id: craftState.nextId++, recipe: craftState.recipe, quantity: craftState.quantity, worker: craftState.worker, station: craftState.station, active: false, progress: 0 });

      const index = craftState.orders.findIndex(order => order.id === Number(id));
      if (index < 0) return;
      const [removed] = craftState.orders.splice(index, 1);
      G().toast(`${recipeById(removed.recipe).name}工单已撤销，留料归还公库`);
    } else if (action === 'craft-up' || action === 'craft-down') {
      const index = craftState.orders.findIndex(order => order.id === Number(id));
      const target = index + (action === 'craft-up' ? -1 : 1);
      if (index < 0 || !craftState.orders[target] || craftState.orders[index].active || craftState.orders[target].active) return;
      [craftState.orders[index], craftState.orders[target]] = [craftState.orders[target], craftState.orders[index]];
      G().toast('工单次序已调整');
    } else if (action === 'craft-order-view') {
      const order = craftState.orders.find(item => item.id === Number(id));

    } else return;

  }

    input(element, eventType) {

      else if (element.dataset.field === 'craft-station' && stations.some(item => item.id === element.value && item.group === craftState.group)) craftState.station = element.value;

    }
  };
})();

  let dest='town',prepare=false,companion=false,trip=false;
  function map(){let peaks='';for(let j=0;j<16;j++){let x=(j*137+30)%740,y=(j*67+26)%440;peaks+=`<g transform="translate(${x},${y})" opacity="${.12+(j%3)*.06}"><path d="M-60 50L0-40 45 50 78 65-90 65Z" fill="#668574"/><path d="M0-40l-10 38 20-6 35 58" fill="none" stroke="#3f675a" stroke-width="2"/></g>`;}return `<div class="world-map"><svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="contours" width="160" height="110" patternUnits="userSpaceOnUse"><path d="M-20 85Q70-30 180 50M-10 100Q80-10 170 65" fill="none" stroke="#6d8c78" opacity=".11"/></pattern></defs><rect width="800" height="500" fill="#d3d7b8"/><rect width="800" height="500" fill="url(#contours)"/>${peaks}<path d="M430-20C510 60 290 80 380 190S590 330 440 500" stroke="#8daeb0" stroke-width="18" fill="none" opacity=".65"/><path d="M256 170L432 130M256 170Q390 390 592 330M256 170Q60 270 152 380" stroke="#927453" stroke-width="2" stroke-dasharray="5 7" fill="none"/><text x="575" y="80" class="map-region">云岫群山</text><text x="350" y="440" class="map-river">青 泠 江</text></svg><span class="map-compass">北<br>✦</span>${places.map(p=>`<button class="map-site ${p.id===dest?'selected':''}" style="left:${p.x}%;top:${p.y}%" data-action="map-select" data-id="${p.id}"><span>${I(p.icon)}</span><strong>${p.name}</strong></button>`).join('')}</div>`;}
  GamePanels.world={title:'山外',enter(p){if(p.destination && p.destination!==dest){dest=p.destination;trip=false;companion=false;}prepare=false;},render(){const p=places.find(v=>v.id===dest);return `<div class="world-layout">${map()}<aside class="world-detail pane"><small class="gold">云岫地界 · ${p.kind}</small><h2>${p.name}</h2><p>${p.desc}</p><div class="world-vignette">${I(p.icon)}</div><div class="data-row"><span>路程</span><b>${p.path}</b></div><div class="data-row"><span>沿途</span><b class="${p.id==='cave'?'danger':''}">${p.risk}</b></div><h3 class="pane-title">已知情报</h3><p>${p.find}</p>${prepare?`<div class="travel-prep"><h3 class="pane-title">同行准备</h3><div class="data-row"><span>沈照</span><b>掌门</b></div><button data-action="travel-companion" class="travel-companion ${companion?'active':''}">${Game.portrait(1)}<span>林晚棠<small>${companion?'已发出邀约':'可邀约同行'}</small></span><b>${companion?'✓':'＋'}</b></button><div class="data-row"><span>干粮</span><b>2 / 6</b></div><button data-action="travel-confirm" class="game-button primary">${trip?'行程已备妥':'备妥行程'}</button></div>`:`<button class="game-button primary" data-action="travel-prepare">${p.id==='home'?'返回山院':'筹备出行'}</button>`}</aside></div>`;},click(b){if(b.dataset.action==='map-select'){dest=b.dataset.id;prepare=false;trip=false;Game.refresh();}if(b.dataset.action==='travel-prepare'){if(dest==='home')Game.open('scene',{label:'云岫山院'});else{prepare=true;Game.refresh();}}if(b.dataset.action==='travel-companion'){companion=!companion;Game.refresh();}if(b.dataset.action==='travel-confirm'){trip=true;Game.refresh();Game.toast('行程已备妥 · 等候出发');}}};
  const transferred={}; Game.addToStore=(name,n)=>{transferred[name]=(transferred[name]||0)+n;};
  let sectTab='差事',job=0,priority=0;const invitations=new Set();const jobs=[['青梧丹房','炼制养元丹','林晚棠','凝丹中','cauldron'],['西侧木场','运送木料','赵石','运材中','wood'],['采石处','开采石材','空缺','待人接任','stone'],['主殿建位','营造主殿','沈照','待备料','build']];let permission='择徒',peak='清溪峰';const peakPermissions={'清溪峰':true,'青梧峰':true,'赤炉峰':false};
  GamePanels.sect={title:'宗务',render(){return `<div class="sect-layout"><div class="panel-tabs sect-tabs">${['差事','公库','各峰权限'].map(v=>`<button data-action="sect-tab" data-value="${v}" class="${sectTab===v?'active':''}">${v}</button>`).join('')}</div>${sectTab==='差事'?`<div class="sect-work pane"><div class="pane-title">山院事务 <small>4 处 · 1 处空缺</small></div><div class="work-table-head"><span>工位</span><span>当前人手</span><span>进展</span><span>次序</span></div>${jobs.map((j,k)=>`<button data-action="sect-job" data-id="${k}" class="work-row ${job===k?'active':''}"><span>${I(j[4])}<b>${j[0]}<small>${j[1]}</small></b></span><span>${invitations.has(k)?'已发邀约':j[2]}</span><span class="${j[2]==='空缺'?'danger':'subtle'}">${j[3]}</span><span>${priority===k?'优先':'常序'}</span></button>`).join('')}<div class="work-bottom"><span>供给</span><b>${I('wood')} 青木 18</b><b>${I('stone')} 石材 24</b><b>${I('herb')} 灵草 6</b></div></div><aside class="sect-detail pane"><span class="sect-emblem">${I(jobs[job][4])}</span><h2>${jobs[job][0]}</h2><div class="data-row"><span>事务</span><b>${jobs[job][1]}</b></div><div class="data-row"><span>工位</span><b>1 / 2</b></div><div class="data-row"><span>当前人手</span><b>${jobs[job][2]}</b></div><h3 class="pane-title">可邀约门人</h3><button class="invite-person ${invitations.has(job)?'active':''}" data-action="sect-invite">${Game.portrait(0)}<span>周远<small>${invitations.has(job)?'邀约待答复':'当前闲暇 · 擅长劳作'}</small></span><b>${invitations.has(job)?'已邀约':'邀约'}</b></button><button class="game-button" data-action="sect-priority">${priority===job?'恢复常序':'优先安排此事'}</button><button class="game-button" data-action="sect-locate">查看工位</button></aside>`:sectTab==='公库'?`<div class="store-pane pane"><h3 class="pane-title">山院公库 <small>收支与物资</small></h3>${[['wood','青木',18,'营造'],['stone','石材',24,'营造'],['herb','灵草',6,'疗伤 / 炼丹'],['jade','灵石',12,'修行 / 易物'],['food','干粮',6,'出行']].map(r=>`<div class="store-row"><span class="icon-slot">${I(r[0])}</span><b>${r[1]}</b><strong>${r[2]}</strong><span class="subtle">${r[3]}</span></div>`).join('')}</div><aside class="sect-detail pane"><h3 class="pane-title">近日收支</h3>${Object.entries(transferred).map(([n,q])=>`<div class="ledger-entry"><b>${E(n)} +${q}</b><span>沈照 · 行囊转入</span></div>`).join('')}<div class="ledger-entry"><b>青木 +6</b><span>赵石 · 采伐</span></div><div class="ledger-entry"><b>灵草 −2</b><span>沈照 · 疗伤</span></div><div class="ledger-entry"><b>石材 +8</b><span>山院采石处</span></div></aside>`:`<div class="permission-pane pane"><h3 class="pane-title">各峰权限</h3><div class="panel-tabs">${Object.keys(peakPermissions).map(x=>`<button data-action="sect-peak" data-value="${x}" class="${peak===x?'active':''}">${x}</button>`).join('')}</div><div class="permission-owner">${Game.portrait(0,true)}<div><h2>${peak}</h2><p>执掌 · ${peak==='清溪峰'?'苏见雪':peak==='青梧峰'?'何砚秋':'顾长风'}</p></div></div>${['择徒','传授','公库取用'].map(v=>`<button class="permission-row ${permission===v?'active':''}" data-action="permission" data-value="${v}"><span>${I(v==='择徒'?'person':v==='传授'?'book':'jade')}</span><b>${v}</b><em>${v==='择徒'?(peakPermissions[peak]?'可择外门、内门':'请示掌门'):v==='传授'?'按所授法门':'按各峰份额'}</em><i>›</i></button>`).join('')}</div><aside class="sect-detail pane"><h3 class="pane-title">${permission}</h3><p>${permission==='择徒'?'收下门人时，定为外门、内门或亲传。各峰在已授权限内择徒。':permission==='传授'?'可传法门依典籍与传法者所学而定。':'各峰所取物资记入公库收支。'}</p>${permission==='择徒'?`<div class="data-row"><span>外门 / 内门</span><b>${peakPermissions[peak]?'可自行收录':'请示掌门'}</b></div><div class="data-row"><span>亲传</span><b>掌门亲定</b></div><button class="game-button primary" data-action="permission-toggle">${peakPermissions[peak]?'收回择徒权限':'授予择徒权限'}</button>`:'<div class="data-row"><span>执掌</span><b>按本峰现行章程</b></div>'}</aside>`}</div>`;},click(b){const a=b.dataset.action;if(a==='sect-tab')sectTab=b.dataset.value;if(a==='sect-job')job=Number(b.dataset.id);if(a==='sect-invite'){invitations.add(job);Game.toast('已向周远发出邀约');}if(a==='sect-priority')priority=priority===job?-1:job;if(a==='permission')permission=b.dataset.value;if(a==='sect-peak')peak=b.dataset.value;if(a==='permission-toggle'){peakPermissions[peak]=!peakPermissions[peak];Game.toast(peak+'择徒权限已更新');}if(a==='sect-locate'){Game.open('scene',{label:jobs[job][0]});return;}Game.refresh();}};
  let build=0;const buildPlans=new Set();const builds=[{name:'主殿',kind:'宗门中枢',icon:'build',wood:30,stone:20,asset:'hall-foundation.png',desc:'议事、接待与宗门立名。',need:'还需青木 12'}, {name:'草庐',kind:'门人住居',icon:'build',wood:16,stone:8,asset:'shelter-concept.png',desc:'设床位二处，供门人安歇。',need:''}, {name:'药圃',kind:'草木灵田',icon:'herb',wood:8,stone:6,asset:'herb-terrace.png',desc:'开垦药田，照料入门灵草。',need:''}];
  GamePanels.build={title:'营造',render(){const b=builds[build],planned=buildPlans.has(build);return `<div class="build-view"><div class="build-site"><img src="${b.asset}" alt="${b.name}营造预览"><div class="build-footprint"></div><span>${build===0?'北侧高台':build===1?'西侧缓坡':'东侧泉畔'}</span></div><aside class="build-detail pane"><small class="gold">${b.kind}</small><h2>${b.name}</h2><p>${b.desc}</p><div class="build-cost"><span>${I('wood')}<b class="${b.wood>18?'danger':''}">18 / ${b.wood}</b></span><span>${I('stone')}<b>24 / ${b.stone}</b></span></div><p class="${b.need?'danger':'good'}">${planned?'已列入营造事务':b.need||'物资齐备'}</p><button data-action="build-confirm" class="game-button primary" ${b.need||planned?'disabled':''}>${planned?'工程已安排':'安排营造'}</button><button data-action="build-cancel" class="game-button">收起营造图</button></aside><div class="build-palette">${builds.map((v,k)=>`<button data-action="build-select" data-id="${k}" class="${k===build?'active':''}"><span>${I(v.icon)}</span><b>${v.name}</b><small>${v.kind}</small></button>`).join('')}</div></div>`;},click(b){if(b.dataset.action==='build-select'){build=Number(b.dataset.id);Game.refresh();}if(b.dataset.action==='build-confirm'){buildPlans.add(build);Game.refresh();Game.toast(builds[build].name+'已列入营造事务');}if(b.dataset.action==='build-cancel')Game.open('scene');}};
  const nav=[['disciples','门人','person'],['arts','功法','book'],['bag','行囊','jade'],['crafts','百艺','cauldron'],['tasks','任务','scroll'],['world','山外','mountain'],['sect','宗务','flag']];
  document.querySelector('#game-nav').innerHTML=nav.map((n,i)=>`<button data-nav="${n[0]}" title="${n[1]}"><span>${I(n[2])}</span><b>${n[1]}</b><small>${i+1}</small></button>`).join('');
  const resources={wood:18,stone:24,herb:6,jade:12};document.querySelectorAll('[data-resource]').forEach(el=>el.innerHTML=I(el.dataset.resource)+`<b>${resources[el.dataset.resource]}</b>`);
  document.querySelector('.tool-icon').innerHTML=I('build');
  document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.nav){Game.open(b.dataset.nav);return;}if(b.hasAttribute('data-close')){Game.open('scene');return;}if(b.dataset.action)GamePanels[Game.current]?.click?.(b);});
  for(const type of ['input','change'])document.addEventListener(type,e=>{if(Game.rendering)return;if(type==='change'&&e.target.tagName==='INPUT')return;if(type==='input'&&e.target.tagName==='SELECT')return;if(e.target.dataset.field)GamePanels[Game.current]?.input?.(e.target,type);});
  document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='Escape')Game.open('scene');if(/^[1-7]$/.test(e.key))Game.open(nav[Number(e.key)-1][0]);});
  function fitScene(){document.querySelector('.scene-world').style.setProperty('--scene-scale',Math.max(innerWidth/1440,innerHeight/900));}fitScene();window.addEventListener('resize',()=>{fitScene();requestAnimationFrame(()=>Game.drawTree());});
  Game.open(new URLSearchParams(location.search).get('page')||'disciples');
})();
</script></body></html>
