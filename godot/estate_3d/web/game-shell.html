<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17251f">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="game-ui.css">
  <link rel="stylesheet" href="system-ui.css">
  <link rel="stylesheet" href="system-people.css">
  <link rel="stylesheet" href="system-inventory.css">
  <title>余烬立山 · 云岫山院</title>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="云岫山院：点人物或地块查看，点院地移动掌门，拖动和滚轮调整镜头"></canvas>
  <main id="game-ui" aria-label="云岫山院游戏界面">
    <div class="crest" aria-hidden="true"><span>岚</span></div>
    <div class="nameplate"><strong>余烬立山</strong><small>逃出生天 · 云岫山院</small></div>
    <div class="skyline"><span class="time" id="time">第 1 日</span><span class="season">云岫初春</span><span class="resources" id="resources"></span></div>
    <div class="system-shade" id="system-shade" hidden></div>
    <button class="master-hud" data-tab="master" aria-label="查看掌门"><span id="master-hud-portrait"></span><span><strong id="master-hud-name"></strong><small id="master-hud-realm"></small></span></button>
    <nav class="rail" id="system-nav" aria-label="宗门系统">
      <button data-tab="disciples"><i data-icon="person"></i><b>门人</b><small>1</small></button>
      <button data-tab="arts"><i data-icon="book"></i><b>功法</b><small>2</small></button>
      <button data-tab="bag"><i data-icon="jade"></i><b>行囊</b><small>3</small></button>
      <button data-tab="crafts"><i data-icon="cauldron"></i><b>百艺</b><small>4</small></button>
      <button data-tab="tasks"><i data-icon="scroll"></i><b>任务</b><small>5</small></button>
      <button data-tab="world"><i data-icon="mountain"></i><b>山外</b><small>6</small></button>
      <button data-tab="sect"><i data-icon="flag"></i><b>宗务</b><small>7</small></button>
    </nav>
    <button class="scene-tool" id="build-tool"><i data-icon="build"></i>营造</button>
    <section class="dossier system-window" id="dossier" aria-label="宗门系统卷册" hidden>
      <header class="window-head"><span class="title-flourish" aria-hidden="true">◇</span><h1 id="panel-title">门人</h1><i class="head-line" aria-hidden="true"></i><button class="close-window" id="close-panel" aria-label="返回山院">×</button></header>
      <div id="panel-content"></div>
      <footer class="window-foot"><span>云岫山院</span><i></i><span id="panel-feedback" role="status"></span><i></i><button data-tab="archive">存档</button><span>Esc 返回山院</span></footer>
    </section>
    <section class="dossier estate-panel" id="estate-panel" aria-label="山院卷册" hidden>
      <button class="close" id="close-estate-panel" aria-label="收起卷册">×</button>
      <div class="dossier-inner">
        <div class="dossier-header"><h2 id="estate-side-title">山院</h2></div>
        <div id="estate-content"></div>
      </div>
    </section>
    <div class="opening-goal" id="opening-goal"><span class="goal-kicker">眼前之事</span><strong id="goal-title">先在山院安身</strong><p id="goal-copy">落脚处还能遮风，伤势稳住后便可立殿。</p><button id="goal-action" hidden>用灵草调息</button></div>
    <div class="corner-controls" aria-label="场景控制">
      <div class="compass" aria-hidden="true"><span class="compass-n">北</span><span class="compass-west">西</span><i></i><span class="compass-east">东</span><span class="compass-s">南</span></div>
      <button id="zoom-out" aria-label="缩小镜头">−</button><button id="zoom-in" aria-label="放大镜头">＋</button>
      <button id="follow" aria-label="跟随掌门">⌖</button><button id="pause" aria-label="暂停或继续">Ⅱ</button>
    </div>
    <div class="notice" id="notice" role="status">点落脚处或营造地查看 · 点院地行走</div>
  </main>
  <section class="loading" id="loading" aria-live="polite"><div class="loading-seal">岚</div><h1>余烬立山</h1><p>正在打开云岫山院</p><progress id="progress"></progress><p id="error"></p></section>
  <script>window.__paintedGameMode = true;</script>
  <script src="$GODOT_URL"></script>
  <script type="module">
    import {bootGodotHost} from './runtime/ea-godot-host.mjs';
    import {startEstateGameUI} from './game-ui.mjs?v=u120-live-1';
    const configuration=$GODOT_CONFIG;
    const loading=document.getElementById('loading'), progress=document.getElementById('progress');
    try {
      const missing=Engine.getMissingFeatures({threads:false});
      if(missing.length)throw Error('浏览器暂时无法运行山院：'+missing.join('、'));
      const siteLayout=await fetch('./estate-sites.json').then(response=>{if(!response.ok)throw Error('山院营造地未能载入');return response.json()});
      const host=await bootGodotHost({preview:'estate-game',siteLayout});
      startEstateGameUI(host,siteLayout);
      const engine=new Engine(configuration);
      await engine.startGame({canvas:document.getElementById('canvas'),onProgress(current,total){if(total>0){progress.max=total;progress.value=current}}});
      loading.hidden=true;
      host.start();
    } catch(failure) {
      progress.hidden=true;
      document.getElementById('error').textContent=failure.message||String(failure);
      console.error(failure);
    }
  </script>
</body>
</html>
