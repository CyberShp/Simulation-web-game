<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云岫山院 · 山院实景</title><link rel="stylesheet" href="courtyard.css"><link rel="stylesheet" href="courtyard-opening.css"><link rel="stylesheet" href="courtyard-combat.css"></head><body>
<canvas id="scene" aria-label="云岫山院，点击地面行走，点击人物查看近况"></canvas>
<header id="title"><strong>云岫山院</strong><span id="clock"></span><p id="simulation-status" role="status">正在入院</p></header>
<nav id="tools" aria-label="山院镜头与院务"><div class="tool-group system-tools"><button id="affairs">院务</button><button id="people">人物</button><button id="growth">修行</button><button id="supply">物资</button><button id="expedition-open">去山门</button></div><div class="tool-group view-tools"><button id="home">回小院</button><button id="domain">山域规划</button><button id="follow">寻掌门</button><button id="compare">原稿对照</button></div><div class="tool-group session-tools"><button id="pause">暂停</button><button id="save">保存</button><button id="recovery-open">恢复文件</button></div></nav>
<section id="expedition" hidden aria-label="掌门山外行程">
<canvas id="expedition-canvas" tabindex="0" aria-label="独立林间战场，WASD移动，鼠标瞄准，数字键施技"></canvas>
<div id="expedition-heading"><h2 id="expedition-name">云岫山谷</h2><p id="expedition-help"></p></div>
<p id="combat-enemy-status" hidden></p>
<div id="expedition-encounter"><div class="encounter-person"><img src="assets/cultivator-v1.png" alt="掌门蓝白袍持剑形象"><span id="encounter-person-name">掌门</span></div><p class="encounter-eyebrow">山谷遭遇</p><h3 id="encounter-name">伤人山魈</h3><p id="encounter-description"></p><p id="encounter-position"></p><img id="encounter-foe" class="encounter-foe" src="assets/valley-shanxiao-pixel-v1.png" alt="林间山魈观察"></div>
<div id="expedition-controls"><p id="combat-state"></p><p id="combat-message" role="status"></p>
<div id="expedition-world-actions"><button id="expedition-approach">走近山魈</button><button id="expedition-engage">应战</button><button id="expedition-exit">走向归院道</button></div>
<div id="combat-actions" hidden><div class="combat-buttons">
<button data-combat-action="attack"><kbd>1</kbd><span class="skill-name">基础剑式</span><small class="skill-cooldown">就绪</small></button>
<button data-combat-action="spell"><kbd>2</kbd><span class="skill-name">青岚术</span><small class="skill-cooldown">就绪</small></button>
<button data-combat-action="guard"><kbd>3</kbd><span class="skill-name">护持</span><small class="skill-cooldown">就绪</small></button>
<button data-combat-action="dodge"><kbd>Space</kbd><span class="skill-name">短步</span><small class="skill-cooldown">就绪</small></button>
</div><button id="combat-auto" aria-pressed="false">自动普攻 · 关</button><button data-combat-action="retreat"><span class="skill-name">撤退</span></button></div>
<button id="combat-acknowledge" hidden>确认战报</button><button id="expedition-return" hidden>中止行程，沿来路返回</button></div>
</section>
<aside id="management" aria-label="山院管理" hidden>
  <header><h2>山院簿</h2><button id="close-management" aria-label="收起山院簿">×</button></header>
  <div class="management-tabs" role="tablist" aria-label="院务分类"><button data-tab="affairs" role="tab">院务</button><button data-tab="people" role="tab">人物</button><button data-tab="growth" role="tab">修行</button><button data-tab="supply" role="tab">物资</button></div>
  <p class="management-note">查看院务时世界继续运行，可随时暂停。</p><div id="management-body"></div>
</aside>
<section id="save-protection" role="alert" hidden><strong>保存未完成，世界已保护暂停</strong><p id="save-error"></p><p>当前进度仍在内存中，原存档保留。请重试保存，或先导出恢复文件。</p><div><button id="retry-save">重试保存</button><button id="export-recovery">导出恢复文件</button><button id="exit-recovery" disabled>使用恢复文件退出</button></div><p id="recovery-note"></p></section>
<div id="reference-note" hidden>原稿对照 · 世界静止</div>
<footer id="hint"><span id="action">左键行走与查看 · 滚轮缩放 · 右键拖动 · H 收起界面</span><span id="save-note">院务已载入</span></footer>
<div id="notice" role="status" hidden></div>
<div id="dialog" class="shade" hidden><section class="conversation" role="dialog" aria-modal="true" aria-labelledby="person-name"><button class="close" id="close-person" aria-label="关闭">×</button><div class="portrait"><canvas id="portrait" width="300" height="420"></canvas><h1 id="person-name"></h1><p id="person-role"></p></div><div class="speech"><div id="person-reading"><p class="eyebrow" id="person-eyebrow">人物观察</p><p id="person-speech"></p><p id="person-detail"></p><div id="person-content"></div></div><div class="person-footer"><button id="focus-person">看看位置</button><button id="approach-person">走近查看</button><button id="leave-person">收起</button></div></div></section></div>
<div id="building-dialog" class="shade" hidden><section class="building" role="dialog" aria-modal="true" aria-labelledby="building-name"><button id="close-building" class="close" aria-label="关闭">×</button><p class="eyebrow">山院营造</p><h1 id="building-name"></h1><p id="building-detail"></p><div id="building-slots"></div><button id="building-walk">走到门前</button></section></div>
<div id="recovery-dialog" class="shade" hidden><section class="recovery-panel" role="dialog" aria-modal="true" aria-labelledby="recovery-title"><h2 id="recovery-title">恢复山院进度</h2><p id="recovery-preview" role="status">请选择恢复文件。</p><p>确认恢复时，会先备份原存档与当前进度，再载入选中的进度。</p><div><button id="recovery-choose">选择文件</button><button id="recovery-confirm" disabled>确认恢复</button><button id="recovery-cancel">返回</button></div></section></div>
<div id="loading"><span id="loading-error">正在入院</span><div id="loading-actions" hidden><button id="retry-load">重试读取</button><button id="loading-recovery">选择恢复文件</button></div></div>
<script type="module" src="courtyard-main.mjs"></script></body></html>
